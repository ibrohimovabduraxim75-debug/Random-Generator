<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <div class="card">
    <h1>Random Number</h1>

    <label for="min">Start number</label>
    <input type="number" id="min" placeholder="e.g. 1">

    <label for="max">End number</label>
    <input type="number" id="max" placeholder="e.g. 10">

    <button id="btn">Generate number</button>

    <div class="result" id="result">—</div>
    <div class="msg" id="msg"></div>
    <div class="info" id="info"></div>
    <div class="history" id="history"></div>

    <button class="reset" id="reset">Start over</button>
  </div>


  <script src="./script.js"></script>
</body>

</html>
